name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/aws-credentials.json
          mkdir -p ~/.aws
          AK=$(python -c "import json;print(json.load(open('/tmp/aws-credentials.json'))['aws_access_key_id'])")
          SK=$(python -c "import json;print(json.load(open('/tmp/aws-credentials.json'))['aws_secret_access_key'])")
          {
            echo "[default]"
            echo "aws_access_key_id = $AK"
            echo "aws_secret_access_key = $SK"
          } > ~/.aws/credentials
          chmod 600 ~/.aws/credentials
          {
            echo "[profile lab]"
            echo "aws_access_key_id = $AK"
            echo "aws_secret_access_key = $SK"
          } > ~/.aws/config
          echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/credentials" >> $GITHUB_ENV
          echo "AWS_CONFIG_FILE=$HOME/.aws/config" >> $GITHUB_ENV
          echo "AWS_EC2_METADATA_DISABLED=true" >> $GITHUB_ENV
          echo "AWS_PROFILE=lab" >> $GITHUB_ENV

      - name: Verify S3 access
        run: |
          aws sts get-caller-identity
          aws s3 ls "s3://${{ secrets.ARTIFACT_BUCKET }}/dvc/files/md5/"

      - name: Pull data with DVC
        run: |
          export AWS_ACCESS_KEY_ID=$(python -c "import json;print(json.load(open('/tmp/aws-credentials.json'))['aws_access_key_id'])")
          export AWS_SECRET_ACCESS_KEY=$(python -c "import json;print(json.load(open('/tmp/aws-credentials.json'))['aws_secret_access_key'])")
          echo "--- debug: aws cli getobject ---"
          aws s3 cp "s3://${{ secrets.ARTIFACT_BUCKET }}/dvc/files/md5/cf/1eb2775d4c40a5f4dba7aadb8406d6" /tmp/probe.bin && echo "AWSCLI_GETOBJECT_OK" || echo "AWSCLI_GETOBJECT_FAILED"
          echo "--- debug: boto3 head_object ---"
          python - <<'PYEOF'
          import boto3
          s3 = boto3.client("s3", region_name="ap-southeast-1")
          try:
              s3.head_object(Bucket="income-lab-vhthien", Key="dvc/files/md5/cf/1eb2775d4c40a5f4dba7aadb8406d6")
              print("BOTO3_HEAD_OK")
          except Exception as e:
              print("BOTO3_HEAD_FAIL:", type(e).__name__, e)
          PYEOF
          echo "--- dvc pull ---"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          aws s3 cp models/model.joblib "s3://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/model.joblib"
          echo "Uploaded model.joblib successfully"

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python3 - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1